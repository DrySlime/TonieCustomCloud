# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name tonies.seibel-netsec.com;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name tonies.seibel-netsec.com;

    # SSL Konfiguration (Cloudflare Origin Certs)
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 250M;

    # SICHERHEIT: Admin-Dashboard und sensible Management-APIs von aussen sperren
    location /web {
        default_type text/plain;
        return 403 "Zugriff verweigert: Das Admin-Dashboard ist aus Sicherheitsgruenden nur im lokalen Heimnetzwerk erreichbar (http://192.168.178.29:8088/web/).\n";
    }

    location ~ ^/api/(settings|esp32|uploadCert|fileDelete|dirDelete|trigger) {
        default_type text/plain;
        return 403 "Zugriff verweigert: Admin-APIs sind nur im lokalen Heimnetzwerk erreichbar.\n";
    }

    # PASSWORT-SCHUTZ: Schreib- und Upload-APIs nur mit gueltigem Passwort (Ivan19, Carla03, Joel09)
    location ~ ^/api/(toniesCustomJsonUpsert|fileUpload|tafUpload|pcmUpload) {
        default_type application/json;
        if ($http_x_tonie_key !~* "^(Ivan19|Carla03|Joel09)$") {
            return 403 '{"error":"Passwort erforderlich oder ungueltig. Zugriff verweigert."}';
        }

        proxy_pass http://teddycloud:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direkte Auslieferung von index.html bei Root und /pwa/ OHNE 302-Redirects
    location = / {
        proxy_pass http://teddycloud:80/pwa/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /pwa {
        return 301 /pwa/;
    }

    location = /pwa/ {
        proxy_pass http://teddycloud:80/pwa/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consumer PWA & erlaubte APIs
    location / {
        proxy_pass http://teddycloud:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
